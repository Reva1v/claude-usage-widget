name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      # Runs before anything expensive. Both mistakes below are cheap to fix and
      # ruinous to miss, and a later check would only catch them after a
      # notarisation submission had already been spent.
      - name: Verify version bookkeeping
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          BUNDLE_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Resources/Info.plist)
          PLIST_SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)

          # Sparkle compares CFBundleVersion, not the marketing version. An
          # unbumped bundle version publishes a release that no installed copy
          # will ever see as an update — a silent failure that looks like a
          # successful release.
          PREV=$(grep -o '<sparkle:version>[0-9]*</sparkle:version>' appcast.xml | grep -o '[0-9]*' || echo 0)
          if [ "$BUNDLE_VER" -le "${PREV:-0}" ]; then
            echo "CFBundleVersion is $BUNDLE_VER but the last release published $PREV."
            echo "Bump CFBundleVersion in Resources/Info.plist before tagging."
            exit 1
          fi

          # Sparkle's update dialog reads the tag while the app's own menu reads
          # the plist; letting them diverge means a user installs "0.2.0" and
          # still sees 0.1.0 in the menu afterwards.
          if [ "$PLIST_SHORT" != "$VERSION" ]; then
            echo "Tag says $VERSION but CFBundleShortVersionString is $PLIST_SHORT."
            echo "Update Resources/Info.plist to match the tag before tagging."
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm /tmp/cert.p12

      # Sparkle pulls a binary framework; a stale SwiftPM cache occasionally
      # resolves the wrong artifact in CI. Clearing it keeps builds reproducible.
      - name: Clear stale SwiftPM cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Build release binary
        run: swift build -c release --disable-sandbox

      - name: Assemble and sign app bundle
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="dist/Claude Usage Widget.app"
          mkdir -p "$APP/Contents/MacOS"
          cp .build/release/ClaudeUsageWidget "$APP/Contents/MacOS/ClaudeUsageWidget"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          mkdir -p "$APP/Contents/Resources"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          mkdir -p "$APP/Contents/Frameworks"
          cp -R .build/release/Sparkle.framework "$APP/Contents/Frameworks/Sparkle.framework"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/ClaudeUsageWidget"

          SIGN="Developer ID Application: Serhii Bezbabnykh ($APPLE_TEAM_ID)"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"

          # Sign Sparkle components inside-out, then the framework, then the app.
          codesign --force --options runtime --preserve-metadata=entitlements,identifier \
            --sign "$SIGN" "$SPARKLE/XPCServices/Downloader.xpc"
          codesign --force --options runtime --preserve-metadata=entitlements,identifier \
            --sign "$SIGN" "$SPARKLE/XPCServices/Installer.xpc"
          codesign --force --options runtime --sign "$SIGN" "$SPARKLE/Autoupdate"
          codesign --force --options runtime --sign "$SIGN" "$SPARKLE/Updater.app"
          codesign --force --options runtime --sign "$SIGN" \
            "$APP/Contents/Frameworks/Sparkle.framework"
          codesign --force --options runtime --sign "$SIGN" "$APP"

      - name: Create DMG
        run: |
          mkdir -p dist/dmg_contents
          cp -R "dist/Claude Usage Widget.app" dist/dmg_contents/
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create \
            -volname "Claude Usage Widget" \
            -srcfolder dist/dmg_contents \
            -ov -format UDZO \
            dist/ClaudeUsageWidget.dmg

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/ClaudeUsageWidget.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple notarization ticket
        run: xcrun stapler staple dist/ClaudeUsageWidget.dmg

      - name: Sign DMG for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 -m venv /tmp/sparkle-venv
          /tmp/sparkle-venv/bin/pip install cryptography --quiet
          /tmp/sparkle-venv/bin/python3 << 'PYEOF' >> "$GITHUB_ENV"
          import base64, os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ['SPARKLE_PRIVATE_KEY']))
          data = open('dist/ClaudeUsageWidget.dmg', 'rb').read()
          sig = base64.b64encode(key.sign(data)).decode()
          print(f'ED_SIG={sig}')
          print(f'DMG_LENGTH={len(data)}')
          PYEOF

      - name: Update appcast.xml
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          DMG_URL="https://github.com/TadelUnso/claude-usage-widget/releases/download/${TAG}/ClaudeUsageWidget.dmg"
          BUNDLE_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Resources/Info.plist)

          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
              <channel>
                  <title>Claude Usage Widget</title>
                  <link>https://github.com/TadelUnso/claude-usage-widget</link>
                  <description>Claude Code usage limits as a desktop widget for macOS</description>
                  <language>en</language>
                  <item>
                      <title>Claude Usage Widget ${VERSION}</title>
                      <pubDate>${PUB_DATE}</pubDate>
                      <sparkle:version>${BUNDLE_VER}</sparkle:version>
                      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                      <enclosure
                          url="${DMG_URL}"
                          length="${DMG_LENGTH}"
                          type="application/octet-stream"
                          sparkle:edSignature="${ED_SIG}"
                      />
                  </item>
              </channel>
          </rss>
          EOF

          git config user.email "tadelunso@gmail.com"
          git config user.name "Serhii Bezbabnykh"
          git add appcast.xml
          git commit -m "chore: update appcast.xml for ${TAG}"
          git push origin HEAD:main

      - name: Create release and upload DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" --title "$TAG" --generate-notes dist/ClaudeUsageWidget.dmg
